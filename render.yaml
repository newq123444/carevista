services:
  - type: web
    name: carevista-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    # Apply any new migrations, THEN start. Before this, no deploy ever ran
    # them, so new code met an old schema ("relation … does not exist").
    # If a migration fails the server does not start, and Render keeps the
    # previous version live — better than new code on an old database.
    startCommand: npm run migrate:deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        sync: false
